# Exemple nginx — corrige l'erreur 413 Request Entity Too Large à l'enregistrement d'un ouvrage.
# À placer dans le bloc server { } du site ispisiro.ac.cd, puis : sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name ispisiro.ac.cd www.ispisiro.ac.cd;

    # Autoriser les uploads (image de couverture + PDF/PPT, etc.)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /chemin/vers/ispisiro/staticfiles/;
    }

    location /media/ {
        alias /chemin/vers/ispisiro/static/media/;
    }
}
