{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon1.png' %}">
    <title>Institut Supérieur Pédagogique || Isiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p3YxY+Y3Z4gOy57+E2iF3c1hGkY7Y2Y1k4gZhJwFv0Q3vkW+XtJv+4ZpHA7KAlj0jW1Oo3Pe0uG2xMseHpvQw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            color-scheme: light;
            font-family: 'Inter', sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f2f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #14213d;
        }
        .login-wrapper {
            width: min(460px, calc(100% - 32px));
            padding: 20px 28px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(20, 33, 61, 0.12);
            border: 1px solid rgba(20, 33, 61, 0.08);
        }
        .login-logo {
            /* width: 48px;
            height: 64px; */
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #fff;
        }
        .login-logo img {
            width: 40%;
            /* height: 100%; */
            object-fit: cover;
            display: block;
        }
        .login-title {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.04em;
        }
        .login-subtitle {
            margin: 10px auto 30px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            max-width: 280px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            color: #4b5563;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #d6d7dc;
            border-radius: 10px;
            background: #f8f9fc;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus {
            border-color: #0f6fff;
            box-shadow: 0 0 0 4px rgba(15, 111, 255, 0.12);
            background: #fff;
        }
        .password-field {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }
        .login-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 8px 0 28px;
            flex-wrap: wrap;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #4b5563;
        }
        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: #0f6fff;
        }
        .forgot-link {
            color: #0f6fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: #0f6fff;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 16px 30px rgba(15, 111, 255, 0.18);
        }
        .btn-primary:hover {
            background: #0b55d5;
            transform: translateY(-1px);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            gap: 14px;
            margin: 28px 0 24px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .social-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid #d6d7dc;
            background: #fff;
            color: #111827;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 12px;
        }
        .social-btn:hover {
            border-color: #0f6fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 111, 255, 0.12);
        }
        .social-btn.google i {
            color: #ea4335;
        }
        .social-btn.facebook i {
            color: #1877f2;
        }
        .footer-text {
            margin-top: 18px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        .footer-text a {
            color: #0f6fff;
            text-decoration: none;
            font-weight: 700;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 28px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <img src="{% static 'images/logo/logoisp.png' %}" alt="Logo ISP Isiro">
        </div>
        <h1 class="login-title">Connexion</h1>
        <p class="login-subtitle">Connectez-vous pour accéder à votre compte</p>
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_matricule" class="form-label">Matricule</label>
                <input id="id_matricule" name="matricule" type="text" class="form-control" placeholder="Matricule étudiant" required>
            </div>
            <div class="form-group password-field">
                <label for="id_password" class="form-label">Mot de passe</label>
                <input id="id_password" name="password" type="password" class="form-control" placeholder="Mot de passe" required>
                <span class="toggle-password"><i class="fas fa-eye"></i></span>
            </div>
            <div class="login-actions">
                <label class="checkbox-group"><input type="checkbox" name="remember"> Rester connecté</label>
                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="btn-primary">SE CONNECTER</button>
            <div class="divider">ou</div>
            <p class="footer-text">Vous n’avez pas de compte ? <a href="{% url 'register' %}">Créer un compte</a></p>
        </form>
    </div>
    <script>
        const toggle = document.querySelector('.toggle-password');
        const password = document.querySelector('#id_password');
        if (toggle && password) {
            toggle.addEventListener('click', () => {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                toggle.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
        }
    </script>
</body>
</html>
